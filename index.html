<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPlayer - Spotify-like Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spotify: {
                            green: '#1DB954',
                            dark: '#121212',
                            darker: '#0a0a0a',
                            card: '#181818',
                            hover: '#282828',
                            light: '#b3b3b3',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #121212;
        }

        ::-webkit-scrollbar-thumb {
            background: #535353;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #b3b3b3;
        }

        .progress-bar,
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #4d4d4d;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb,
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-container:hover .progress-bar::-webkit-slider-thumb,
        .volume-container:hover .volume-slider::-webkit-slider-thumb {
            opacity: 1;
        }

        .song-item {
            transition: all 0.2s ease;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .song-item.active {
            background: rgba(29, 185, 84, 0.15);
        }
    </style>
</head>

<body class="bg-spotify-darker text-white font-sans h-screen flex flex-col justify-between overflow-hidden">

    <!-- Main Layout -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- Sidebar (Desktop) -->
        <aside class="w-64 bg-spotify-darker p-6 flex-col border-r border-gray-800 hidden md:flex flex-shrink-0">
            <div class="flex items-center gap-2 mb-8">
                <svg class="w-8 h-8 text-spotify-green" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 14.36c-.18.28-.56.36-.84.18-2.3-1.4-5.2-1.72-8.6-.94-.34.08-.66-.14-.74-.46-.08-.34.14-.66.46-.74 3.74-.86 6.94-.48 9.52 1.08.3.18.38.58.2.88zm1.22-2.72c-.22.36-.7.46-1.06.24-2.64-1.62-6.66-2.1-9.78-1.14-.4.12-.82-.1-.94-.5-.12-.4.1-.82.5-.94 3.56-1.08 7.98-.56 11.02 1.3.36.22.48.7.26 1.04zm.1-2.84c-3.16-1.88-8.36-2.06-11.38-1.14-.48.14-1-.12-1.14-.6-.14-.48.12-1 .6-1.14 3.46-1.06 9.22-.84 12.82 1.3.44.26.58.84.32 1.28-.26.42-.84.56-1.22.3z" />
                </svg>
                <span class="text-xl font-bold">MiniPlayer</span>
            </div>

            <nav class="space-y-4">
                <a href="#" onclick="showWelcome()"
                    class="flex items-center gap-3 text-white font-semibold hover:text-spotify-green transition">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12.5 3.247a1 1 0 00-1 0L4 7.577V20h4.5v-6a1 1 0 011-1h5a1 1 0 011 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 013 0l7.5 4.33a2 2 0 011 1.732V21a1 1 0 01-1 1h-6.5a1 1 0 01-1-1v-6h-3v6a1 1 0 01-1 1H3a1 1 0 01-1-1V7.577a2 2 0 011-1.732l7.5-4.33z" />
                    </svg>
                    Beranda
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-gradient-to-b from-gray-900 to-spotify-dark overflow-y-auto w-full">

            <!-- Header -->
            <header class="sticky top-0 z-10 bg-gradient-to-b from-black/90 to-transparent backdrop-blur-md p-4 md:p-6">
                <div class="flex items-center justify-between gap-4 max-w-7xl mx-auto">
                    <div class="relative flex-1 max-w-md">
                        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 md:w-5 md:h-5 text-gray-400"
                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input type="text" id="searchInput" placeholder="Cari lagu atau artis..."
                            class="w-full pl-10 pr-8 py-2.5 text-sm md:text-base bg-spotify-hover rounded-full text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-spotify-green transition">
                        <button id="clearSearch"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white hidden">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Container Body -->
            <div class="p-4 md:p-6 pb-40 md:pb-32 max-w-7xl mx-auto">

                <!-- Welcome Section -->
                <div id="welcomeSection">
                    <h1 class="text-2xl md:text-3xl font-bold mb-1 md:mb-2">Selamat Datang 👋</h1>
                    <p class="text-xs md:text-sm text-spotify-light mb-6">Cari atau pilih lagu favoritmu dari daftar di
                        bawah.</p>

                    <h2 class="text-lg md:text-xl font-bold mb-4">🎧 Coba Dengarkan</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4"
                        id="quickPicks">
                        <p class="text-spotify-light col-span-full text-sm">Memuat daftar lagu...</p>
                    </div>
                </div>

                <!-- Search Results Section -->
                <div id="searchResults" class="hidden">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg md:text-xl font-bold">Hasil Pencarian</h2>
                        <span id="resultCount" class="text-xs md:text-sm text-spotify-light"></span>
                    </div>
                    <div id="songList" class="space-y-1"></div>
                </div>

                <!-- States -->
                <div id="loadingState" class="hidden text-center py-12">
                    <div
                        class="inline-block w-8 h-8 border-2 border-spotify-green border-t-transparent rounded-full animate-spin">
                    </div>
                    <p class="mt-4 text-sm text-spotify-light">Mencari lagu...</p>
                </div>

                <div id="emptyState" class="hidden text-center py-12">
                    <p class="text-spotify-light text-base">Tidak ada hasil ditemukan</p>
                </div>

                <div id="errorState" class="hidden text-center py-12">
                    <p class="text-red-400 text-base font-semibold">Gagal terhubung ke server</p>
                </div>

            </div>
        </main>
    </div>

    <!-- MODAL DETAIL LAGU -->
    <div id="detailModal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-spotify-card border border-gray-800 rounded-2xl p-5 md:p-6 w-full max-w-md relative shadow-2xl">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white p-1">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>

            <div class="flex flex-col items-center text-center">
                <div id="modalCover"
                    class="w-40 h-40 md:w-48 md:h-48 rounded-xl bg-gray-800 shadow-lg overflow-hidden mb-4 flex items-center justify-center">
                    <svg class="w-12 h-12 text-gray-600" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
                    </svg>
                </div>
                <h3 id="modalTitle" class="text-xl font-bold text-white truncate w-full mb-1">-</h3>
                <p id="modalArtist" class="text-spotify-green text-sm font-medium mb-4 truncate w-full">-</p>

                <!-- Grid Details -->
                <div
                    class="w-full bg-spotify-darker/60 rounded-lg p-3 grid grid-cols-2 gap-3 text-left text-xs md:text-sm">
                    <div>
                        <span class="text-gray-500 block">Album</span>
                        <span id="modalAlbum" class="text-white font-medium truncate block">-</span>
                    </div>
                    <div>
                        <span class="text-gray-500 block">Tahun</span>
                        <span id="modalYear" class="text-white font-medium truncate block">-</span>
                    </div>
                    <div>
                        <span class="text-gray-500 block">Genre</span>
                        <span id="modalGenre" class="text-white font-medium truncate block">-</span>
                    </div>
                    <div>
                        <span class="text-gray-500 block">Durasi</span>
                        <span id="modalDuration" class="text-white font-medium truncate block">--:--</span>
                    </div>
                </div>

                <button id="modalPlayBtn"
                    class="mt-5 w-full bg-spotify-green text-black font-bold py-2.5 rounded-full hover:scale-105 transition">
                    Putar Sekarang
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Player Bar (Responsive) -->
    <div id="playerBar"
        class="fixed bottom-0 left-0 right-0 bg-spotify-card border-t border-gray-800 px-3 md:px-6 py-2 md:py-3 z-40 transform translate-y-full transition-transform duration-300">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-2 md:gap-4 max-w-7xl mx-auto">

            <!-- Song Info -->
            <div class="flex items-center gap-3 w-full sm:w-1/4 min-w-0 justify-between sm:justify-start">
                <div class="flex items-center gap-3 min-w-0">
                    <div id="playerArtwork"
                        class="w-10 h-10 md:w-12 md:h-12 rounded bg-spotify-hover flex-shrink-0 overflow-hidden flex items-center justify-center">
                        <svg class="w-5 h-5 text-gray-500" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <p id="playerTitle" class="text-xs md:text-sm font-medium truncate">-</p>
                        <p id="playerArtist" class="text-[10px] md:text-xs text-spotify-light truncate">-</p>
                    </div>
                </div>

                <!-- Quick Controls Mobile Only -->
                <button id="mobilePlayPauseBtn" onclick="togglePlayPause()" class="sm:hidden text-white p-1">
                    <svg id="mobilePlayIcon" class="w-7 h-7 text-spotify-green" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    <svg id="mobilePauseIcon" class="w-7 h-7 text-spotify-green hidden" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                    </svg>
                </button>
            </div>

            <!-- Player Controls (Desktop & Expanded Mobile) -->
            <div class="hidden sm:flex flex-col items-center w-full sm:w-2/4 max-w-xl">
                <div class="flex items-center gap-4 mb-1">
                    <button id="shuffleBtn" class="text-gray-400 hover:text-white transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
                        </svg>
                    </button>
                    <button id="prevBtn" class="text-gray-400 hover:text-white transition">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                        </svg>
                    </button>
                    <button id="playPauseBtn"
                        class="w-8 h-8 md:w-9 md:h-9 bg-white rounded-full flex items-center justify-center hover:scale-105 transition">
                        <svg id="playIcon" class="w-4 h-4 md:w-5 md:h-5 text-black ml-0.5" fill="currentColor"
                            viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <svg id="pauseIcon" class="w-4 h-4 md:w-5 md:h-5 text-black hidden" fill="currentColor"
                            viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                        </svg>
                    </button>
                    <button id="nextBtn" class="text-gray-400 hover:text-white transition">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                        </svg>
                    </button>
                    <button id="repeatBtn" class="text-gray-400 hover:text-white transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                        </svg>
                    </button>
                </div>

                <div class="flex items-center gap-2 w-full text-xs">
                    <span id="currentTime" class="text-spotify-light w-8 text-right">0:00</span>
                    <div class="progress-container flex-1">
                        <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0"
                            step="0.1">
                    </div>
                    <span id="duration" class="text-spotify-light w-8">0:00</span>
                </div>
            </div>

            <!-- Volume (Desktop) -->
            <div class="hidden sm:flex items-center justify-end gap-2 w-1/4">
                <button id="volumeBtn" class="text-gray-400 hover:text-white">
                    <svg id="volumeIcon" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
                    </svg>
                </button>
                <div class="volume-container w-20">
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="80">
                </div>
            </div>

        </div>
    </div>

    <!-- Hidden Audio -->
    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        const API_BASE_URL = 'https://music-backend-sooty.vercel.app';

        let defaultSongsList = [];
        let currentSongList = [];
        let currentSongIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 0;
        let searchTimeout = null;

        // Cache untuk menyimpan durasi yang sudah dihitung secara otomatis
        const durationCache = {};

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const clearSearch = document.getElementById('clearSearch');
        const welcomeSection = document.getElementById('welcomeSection');
        const searchResults = document.getElementById('searchResults');
        const songList = document.getElementById('songList');
        const resultCount = document.getElementById('resultCount');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const errorState = document.getElementById('errorState');
        const quickPicks = document.getElementById('quickPicks');

        const playerBar = document.getElementById('playerBar');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playerArtwork = document.getElementById('playerArtwork');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const mobilePlayIcon = document.getElementById('mobilePlayIcon');
        const mobilePauseIcon = document.getElementById('mobilePauseIcon');

        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const audio = document.getElementById('audioPlayer');

        function init() {
            loadDefaultSongs();
            setupEventListeners();
            audio.volume = 0.8;
        }

        // FITUR 1: HITUNG DURASI AUDIO OTOMATIS
        function autoCalculateDuration(songUrl, elementId) {
            if (durationCache[songUrl]) {
                const el = document.getElementById(elementId);
                if (el) el.textContent = formatTime(durationCache[songUrl]);
                return;
            }

            const tempAudio = new Audio();
            tempAudio.src = songUrl;
            tempAudio.addEventListener('loadedmetadata', () => {
                durationCache[songUrl] = tempAudio.duration;
                const el = document.getElementById(elementId);
                if (el) el.textContent = formatTime(tempAudio.duration);
            });
        }

        // FETCH DATA SERVER
        async function loadDefaultSongs() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/songs`);
                if (!response.ok) throw new Error('Gagal koneksi');
                const result = await response.json();
                defaultSongsList = result.data || result;
                renderQuickPicks(defaultSongsList);
            } catch (error) {
                quickPicks.innerHTML = '<p class="text-red-400 col-span-full">Gagal memuat lagu dari server.</p>';
            }
        }

        function renderQuickPicks(songs) {
            if (!songs || songs.length === 0) {
                quickPicks.innerHTML = '<p class="text-spotify-light col-span-full">Tidak ada lagu tersedia.</p>';
                return;
            }

            quickPicks.innerHTML = songs.map((song, i) => {
                const durationId = `pick-duration-${i}`;
                autoCalculateDuration(song.url, durationId);

                return `
                <div class="song-item flex items-center justify-between bg-spotify-card hover:bg-spotify-hover rounded-lg p-2.5 cursor-pointer group">
                    <div class="flex items-center gap-3 min-w-0 flex-1" onclick="playFromQuickPicks(${i})">
                        <div class="w-11 h-11 rounded bg-gray-800 flex-shrink-0 overflow-hidden relative">
                            ${song.cover
                        ? `<img src="${song.cover}" class="w-full h-full object-cover">`
                        : `<div class="w-full h-full flex items-center justify-center text-gray-500"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>`
                    }
                        </div>
                        <div class="min-w-0 pr-2">
                            <p class="text-xs md:text-sm font-medium text-white truncate">${song.title}</p>
                            <p class="text-[11px] text-spotify-light truncate">${song.artist}</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <span id="${durationId}" class="text-xs text-spotify-light hidden sm:inline">--:--</span>
                        <button onclick="event.stopPropagation(); openDetailModal(${i}, 'default')" class="p-1.5 text-gray-400 hover:text-spotify-green transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function playFromQuickPicks(index) {
            currentSongList = [...defaultSongsList];
            playSong(index);
        }

        // FITUR 2: MODAL DETAIL & PREVIEW LAGU
        function openDetailModal(index, listType = 'current') {
            const list = listType === 'default' ? defaultSongsList : currentSongList;
            const song = list[index];
            if (!song) return;

            document.getElementById('modalTitle').textContent = song.title || '-';
            document.getElementById('modalArtist').textContent = song.artist || '-';
            document.getElementById('modalAlbum').textContent = song.album || 'Single';
            document.getElementById('modalYear').textContent = song.year || 'N/A';
            document.getElementById('modalGenre').textContent = song.genre || 'Musik';

            const coverContainer = document.getElementById('modalCover');
            if (song.cover) {
                coverContainer.innerHTML = `<img src="${song.cover}" class="w-full h-full object-cover">`;
            } else {
                coverContainer.innerHTML = `<svg class="w-12 h-12 text-gray-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;
            }

            // Gunakan durasi dari cache otomatis
            document.getElementById('modalDuration').textContent = durationCache[song.url] ? formatTime(durationCache[song.url]) : '--:--';

            document.getElementById('modalPlayBtn').onclick = () => {
                if (listType === 'default') currentSongList = [...defaultSongsList];
                playSong(index);
                closeDetailModal();
            };

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // SEARCH & LIST RENDER
        function handleSearch(query) {
            if (!query.trim()) { showWelcome(); return; }
            clearSearch.classList.remove('hidden');
            showLoading();
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => searchSongs(query), 400);
        }

        async function searchSongs(query) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/songs?q=${encodeURIComponent(query)}`);
                const result = await response.json();
                currentSongList = result.data || result;
                if (currentSongList.length === 0) showEmpty();
                else showResults(currentSongList);
            } catch (error) {
                showError();
            }
        }

        function renderSongList(songs) {
            songList.innerHTML = songs.map((song, index) => {
                const durationId = `search-duration-${index}`;
                autoCalculateDuration(song.url, durationId);

                return `
                <div class="song-item flex items-center justify-between px-3 py-2 rounded-md cursor-pointer group ${currentSongIndex === index ? 'active' : ''}"
                     onclick="playSong(${index})">

                    <div class="flex items-center gap-3 min-w-0 flex-1">
                        <span class="text-xs text-spotify-light w-4 text-center">${index + 1}</span>
                        <div class="w-9 h-9 rounded bg-gray-800 flex-shrink-0 overflow-hidden">
                            ${song.cover ? `<img src="${song.cover}" class="w-full h-full object-cover">` : ''}
                        </div>
                        <div class="min-w-0">
                            <p class="text-sm font-medium truncate ${currentSongIndex === index ? 'text-spotify-green' : 'text-white'}">${song.title}</p>
                            <p class="text-xs text-spotify-light truncate">${song.artist}</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <span id="${durationId}" class="text-xs text-spotify-light">--:--</span>
                        <button onclick="event.stopPropagation(); openDetailModal(${index}, 'current')" class="p-1 text-gray-400 hover:text-white">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        // PLAYER CONTROLS
        function playSong(index) {
            currentSongIndex = index;
            const song = currentSongList[index];
            if (!song) return;

            playerBar.classList.remove('translate-y-full');
            playerTitle.textContent = song.title;
            playerArtist.textContent = song.artist;

            if (song.cover) {
                playerArtwork.innerHTML = `<img src="${song.cover}" class="w-full h-full object-cover">`;
            }

            audio.src = song.url;
            audio.play().then(() => setPlayingState(true)).catch(() => setPlayingState(false));

            if (!welcomeSection.classList.contains('hidden')) renderQuickPicks(defaultSongsList);
            else renderSongList(currentSongList);
        }

        function togglePlayPause() {
            if (!audio.src) return;
            if (isPlaying) { audio.pause(); setPlayingState(false); }
            else { audio.play(); setPlayingState(true); }
        }

        function setPlayingState(playing) {
            isPlaying = playing;
            if (playing) {
                playIcon.classList.add('hidden'); pauseIcon.classList.remove('hidden');
                mobilePlayIcon.classList.add('hidden'); mobilePauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden');
                mobilePlayIcon.classList.remove('hidden'); mobilePauseIcon.classList.add('hidden');
            }
        }

        // AUDIO EVENTS
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            if (currentSongIndex < currentSongList.length - 1) {
                playSong(currentSongIndex + 1);
            } else { setPlayingState(false); }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration;
        });

        volumeSlider.addEventListener('input', () => {
            audio.volume = volumeSlider.value / 100;
        });

        // UI HELPERS
        function showWelcome() {
            welcomeSection.classList.remove('hidden');
            searchResults.classList.add('hidden');
            loadingState.classList.add('hidden');
            emptyState.classList.add('hidden');
            errorState.classList.add('hidden');
        }

        function showLoading() {
            welcomeSection.classList.add('hidden');
            searchResults.classList.add('hidden');
            loadingState.classList.remove('hidden');
        }

        function showResults(songs) {
            welcomeSection.classList.add('hidden');
            searchResults.classList.remove('hidden');
            loadingState.classList.add('hidden');
            resultCount.textContent = `${songs.length} lagu`;
            renderSongList(songs);
        }

        function showEmpty() {
            welcomeSection.classList.add('hidden');
            searchResults.classList.add('hidden');
            loadingState.classList.add('hidden');
            emptyState.classList.remove('hidden');
        }

        function showError() {
            welcomeSection.classList.add('hidden');
            searchResults.classList.add('hidden');
            loadingState.classList.add('hidden');
            errorState.classList.remove('hidden');
        }

        function setupEventListeners() {
            searchInput.addEventListener('input', (e) => handleSearch(e.target.value));
            clearSearch.addEventListener('click', () => { searchInput.value = ''; showWelcome(); });
            playPauseBtn.addEventListener('click', togglePlayPause);
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        init();
    </script>
</body>

</html>
